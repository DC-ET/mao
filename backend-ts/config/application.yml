server:
  port: ${MAO_TS_PORT:9080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/mao?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    # Schema owner: TypeScript backend runs migrations on startup.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 12
    validate-on-migrate: false
    locations: filesystem:db/migration

jwt:
  secret: ${JWT_SECRET:mao-dev-jwt-secret-change-me-32bytes!!}
  expiration: 86400000
  refresh-expiration: 604800000
  shell-expiration: ${JWT_SHELL_EXPIRATION:7200000}

# 集成配置（LDAP / 飞书OAuth登录 / 上传 / Tavily/TinyFish 搜索 / OSS）与运行参数（Agent 线程池、
# WS 空闲超时、任务通知调度参数、harness 调参：上下文压缩 / LLM 超时重试 / 网页抓取 / Shell 会话 / 子代理超时）
# 已迁移至管理后台 system_setting，
# 环境变量（LDAP_*、FEISHU_APP_*、UPLOAD_*、TAVILY_API_KEY、TINYFISH_API_KEY、WEB_SEARCH_PROVIDER、OSS_*、
# AGENT_THREAD_POOL_*、APP_WS_IDLE_TIMEOUT_MS、TASK_NOTIFICATION_* 等）仅在升级首次启动时
# 由 SettingsBootstrap 自动导入 DB（加密项需 SETTINGS_SECRET），之后一律以管理后台为准。
# MAX_CONCURRENT_AGENTS / DEFAULT_MAX_ROUNDS / DEFAULT_CONTEXT_ROUNDS 在 TS 后端无消费点，已废弃。

feishu:
  bot:
    enabled: ${FEISHU_BOT_ENABLED:true}
    # 回调签名密钥（APP_FEISHU_BOT_SECRET）
    app-secret-key: ${APP_FEISHU_BOT_SECRET:}
    long-connection:
      enabled: true
      reconcile-interval-ms: 5000
      reconnect-base-ms: 1000
      reconnect-max-ms: 30000
      max-consecutive-failures: 5
    group-context:
      max-items: 20
      max-minutes: 120
      overflow-items: 100
    reply:
      max-length: 2000
    file:
      max-inbound-file-mb: 100

app:
  root-dir: ${MAO_ROOT_DIR:/opt/mao}
  git-credential:
    secret-key: ${APP_GIT_CREDENTIAL_SECRET:}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  ws:
    outbound-queue-capacity: 10000
  task-notification:
    secret-key: ${APP_NOTIFICATION_WEBHOOK_SECRET:mao-task-notification-default-key-v1-20260713}
  harness:
    workspace-root: ${WORKSPACE_ROOT:./workspace}
    runtime-dir: ${MAO_RUNTIME_DIR:/opt/mao-data/runtime}
    user-home-dir: ${MAO_USER_HOME_DIR:/opt/mao-data/users}
    skills-dir: ${SKILLS_DIR:./skills}
    user-skills-dir: ${USER_SKILLS_DIR:}
    share-dir: ${MAO_SHARE_DIR:/opt/mao-data/share}
  mcp:
    secret-key: ${APP_MCP_SECRET:mao-mcp-default-secret-change-me}
    client-timeout-seconds: ${APP_MCP_CLIENT_TIMEOUT_SECONDS:120}
    sync-timeout-seconds: ${APP_MCP_SYNC_TIMEOUT_SECONDS:60}
  # 用户运行时容器隔离（技术方案 §5.12）：mode=host 保持现状；docker 时执行类工具进每用户容器。
  # 注意 MAO_CONTAINER_IDLE_MINUTES 必须大于管理后台配置的 shell 会话空闲超时
  # （sessionIdleTimeoutMinutes，默认 30）：容器先停会把容器内全部 shell 会话杀掉。
  cloud-runtime:
    mode: ${MAO_CLOUD_RUNTIME:host}
    container:
      idle-minutes: ${MAO_CONTAINER_IDLE_MINUTES:60}
      max-lifetime-hours: ${MAO_CONTAINER_MAX_LIFETIME_HOURS:72}
      memory-mb: ${MAO_CONTAINER_MEMORY_MB:2048}
      cpus: ${MAO_CONTAINER_CPUS:2}
      pids-limit: ${MAO_CONTAINER_PIDS_LIMIT:512}
      image: ${MAO_CONTAINER_IMAGE:mao-runtime:latest}
      network: ${MAO_CONTAINER_NETWORK:bridge}
      channel-dir: ${MAO_CONTAINER_CHANNEL_DIR:/opt/mao-data/runtime/channels}
      dist-dir: ${MAO_CONTAINER_DIST_DIR:/opt/mao/backend-ts/dist}
      deps-dir: ${MAO_CONTAINER_DEPS_DIR:/opt/mao-data/deps}
      tmp-dir: ${MAO_CONTAINER_TMP_DIR:/opt/mao-data/tmp}
      tmp-retention-days: ${MAO_CONTAINER_TMP_RETENTION_DAYS:7}
      start-timeout-ms: ${MAO_CONTAINER_START_TIMEOUT_MS:15000}

weixin:
  bot:
    enabled: ${WEIXIN_BOT_ENABLED:true}
    voice-reply: false
    silk-encoder-path: /usr/local/bin/silk-encoder
    ffmpeg-path: ffmpeg
    voice-max-seconds: 300
