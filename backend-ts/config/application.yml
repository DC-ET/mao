server:
  port: ${MAO_TS_PORT:9080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/mao?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    # Schema owner: TypeScript backend runs migrations on startup.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 12
    validate-on-migrate: false
    locations: filesystem:db/migration

jwt:
  secret: ${JWT_SECRET:mao-dev-jwt-secret-change-me-32bytes!!}
  expiration: 86400000
  refresh-expiration: 604800000
  shell-expiration: ${JWT_SHELL_EXPIRATION:7200000}

# 集成配置（LDAP / 飞书OAuth登录 / 上传 / Tavily / OSS）已迁移至管理后台 system_setting，
# 环境变量（LDAP_*、FEISHU_APP_*、UPLOAD_*、TAVILY_API_KEY、OSS_* 等）仅在升级首次启动时
# 由 SettingsBootstrap 自动导入 DB（加密项需 SETTINGS_SECRET），之后一律以管理后台为准。

feishu:
  bot:
    enabled: ${FEISHU_BOT_ENABLED:true}
    # 回调签名密钥（APP_FEISHU_BOT_SECRET）
    app-secret-key: ${APP_FEISHU_BOT_SECRET:}
    long-connection:
      enabled: true
      reconcile-interval-ms: 5000
      reconnect-base-ms: 1000
      reconnect-max-ms: 30000
      max-consecutive-failures: 5
    group-context:
      max-items: 20
      max-minutes: 120
      overflow-items: 100
    reply:
      max-length: 2000
    file:
      max-inbound-file-mb: 100

app:
  root-dir: ${MAO_ROOT_DIR:/opt/mao}
  git-credential:
    secret-key: ${APP_GIT_CREDENTIAL_SECRET:}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  ws:
    idle-timeout-ms: ${APP_WS_IDLE_TIMEOUT_MS:90000}
    outbound-queue-capacity: 10000
  task-notification:
    secret-key: ${APP_NOTIFICATION_WEBHOOK_SECRET:mao-task-notification-default-key-v1-20260713}
    worker-delay-ms: ${TASK_NOTIFICATION_WORKER_DELAY_MS:30000}
    batch-size: ${TASK_NOTIFICATION_BATCH_SIZE:100}
    max-attempts: ${TASK_NOTIFICATION_MAX_ATTEMPTS:4}
  harness:
    workspace-root: ${WORKSPACE_ROOT:./workspace}
    runtime-dir: ${MAO_RUNTIME_DIR:/opt/mao-data/runtime}
    user-home-dir: ${MAO_USER_HOME_DIR:/opt/mao-data/users}
    max-concurrent-agents: ${MAX_CONCURRENT_AGENTS:20}
    agent-thread-pool-size: ${AGENT_THREAD_POOL_SIZE:20}
    agent-thread-pool-max: ${AGENT_THREAD_POOL_MAX:100}
    agent-thread-pool-queue: ${AGENT_THREAD_POOL_QUEUE:200}
    default-max-rounds: ${DEFAULT_MAX_ROUNDS:0}
    default-context-rounds: ${DEFAULT_CONTEXT_ROUNDS:0}
    skills-dir: ${SKILLS_DIR:./skills}
    user-skills-dir: ${USER_SKILLS_DIR:}
    compaction:
      enabled: true
      context-window-tokens: 256000
      trigger-ratio: 0.8
      max-summary-tokens: 12000
      loop-midway-compact: true
    llm:
      rate-limit-max-retries: 10
      rate-limit-retry-delay-seconds: 2
      rate-limit-max-retry-delay-seconds: 30
      call-timeout-seconds: 120
      http-call-timeout-seconds: 180
      stream-idle-timeout-seconds: 300
    web-page:
      connect-timeout: 10000
      read-timeout: 30000
      max-raw-bytes: 1048576
      max-output-length: 500000
      user-agent: Mozilla/5.0 (compatible; AgentWorkbench/1.0)
    shell:
      max-sessions-per-conversation: 30
      session-idle-timeout-minutes: 30
      session-max-lifetime-hours: 2
    delegate:
      timeout-seconds: 3600
      cancel-grace-seconds: 30
  mcp:
    secret-key: ${APP_MCP_SECRET:mao-mcp-default-secret-change-me}
    client-timeout-seconds: ${APP_MCP_CLIENT_TIMEOUT_SECONDS:120}
    sync-timeout-seconds: ${APP_MCP_SYNC_TIMEOUT_SECONDS:60}

weixin:
  bot:
    enabled: ${WEIXIN_BOT_ENABLED:true}
    voice-reply: false
    silk-encoder-path: /usr/local/bin/silk-encoder
    ffmpeg-path: ffmpeg
    voice-max-seconds: 300
