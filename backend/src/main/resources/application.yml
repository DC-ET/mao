server:
  port: 9080
  servlet:
    context-path: /api
  tomcat:
    # Skill 上传单次可包含多个文件，需高于 Tomcat 10.1 默认的 10
    max-part-count: 500

logging:
  level:
    cn.etarch.mao: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.ibatis: INFO
    org.mybatis.spring: INFO
    com.zaxxer.hikari: INFO
    org.springframework.jdbc: INFO
    org.springframework.transaction: INFO

spring:
  application:
    name: mao-server
  profiles:
    active: local # copy from application-example.yml to application-local.yml

  # Flyway — schema owner is TypeScript backend. Re-enable with SPRING_FLYWAY_ENABLED=true.
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 12
    validate-on-migrate: false
    locations: classpath:db/migration

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # File upload
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: cn.etarch.mao.**.entity

# SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# LDAP
ldap:
  enabled: ${LDAP_ENABLED:false}

app:
  # WebSocket 空闲超时（毫秒）：客户端超过该时长无任何消息（含 ping/pong 心跳）即断开。
  # 安卓保活端原生层 25s 心跳可稳定覆盖 90s 默认值；该参数为全局容器参数，仅运维需要时调整。
  ws:
    idle-timeout-ms: ${APP_WS_IDLE_TIMEOUT_MS:90000}

  task-notification:
    secret-key: ${APP_NOTIFICATION_WEBHOOK_SECRET:mao-task-notification-default-key-v1-20260713}
    worker-delay-ms: ${TASK_NOTIFICATION_WORKER_DELAY_MS:30000}
    batch-size: ${TASK_NOTIFICATION_BATCH_SIZE:100}
    max-attempts: ${TASK_NOTIFICATION_MAX_ATTEMPTS:4}

  # 对话上下文压缩（Agent 级可通过 agent.configJson.compaction.* 按 Agent 覆盖）
  harness:
    compaction:
      enabled: true
      # 上下文窗口估算值（token）；若模型配置了 contextWindowTokens 则优先使用模型值
      context-window-tokens: 256000
      # 触发阈值：总 token 达窗口该比例时触发压缩。
      # 输入命中缓存时费用很低，只要在上下文窗口内尽量不主动压缩，故阈值较高
      trigger-ratio: 0.8
      # 全量交接正文的软目标，仅写入提示词，不作为 API 输出 token 限制
      max-summary-tokens: 12000
      # 完整工具轮持久化后允许执行 mid-loop 全量交接压缩
      loop-midway-compact: true

  # MCP（Model Context Protocol）客户端
  mcp:
    # 环境变量加密密钥（必须通过环境变量注入，禁止明文写死）
    secret-key: ${APP_MCP_SECRET:mao-mcp-default-secret-change-me}
    # CLOUD 模式单次工具调用超时（秒）
    client-timeout-seconds: ${APP_MCP_CLIENT_TIMEOUT_SECONDS:120}
    # LOCAL 模式等待桌面端工具清单上报超时（秒）
    sync-timeout-seconds: ${APP_MCP_SYNC_TIMEOUT_SECONDS:60}

# 微信 Bot 通道
weixin:
  bot:
    # Agent 回复是否附带语音（TTS 合成 → MP3 文件消息），默认关闭，用户可在客户端「微信Bot」设置页单独开启
    voice-reply: false
    # SILK 编码器路径（腾讯 silk-v3 encoder，编译后部署到 /usr/local/bin/silk-encoder）
    silk-encoder-path: /usr/local/bin/silk-encoder
    # ffmpeg 可执行文件路径
    ffmpeg-path: ffmpeg
    # 语音最大时长（秒），超长文本在句子边界截断；微信侧为 MP3 文件消息，无语音条 60 秒限制，默认 300 秒尽量覆盖完整回复
    voice-max-seconds: 300
