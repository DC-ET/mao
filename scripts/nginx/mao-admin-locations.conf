# 粘贴进桌面 Web 那个 server { } 内，且必须在桌面端
#   location ~* \.(js|css|...)$  和  location /  之前。
# 不要单独作为完整 vhost。HTTPS 证书、server_name、/api/、/uploads/ 保持原样。
#
# 禁止：
# - rewrite ^/admin/(.*)$ /$1  （/admin/ 会变成 /，被桌面端 location / 接管，白屏）
# - try_files ... /index.html 或 try_files ... /admin/index.html
#   （最后一项是 URI，会重新走 location 匹配，落到桌面 SPA）

location = /admin {
    return 302 /admin/;
}

location = /admin/ {
    default_type text/html;
    alias /opt/mao/admin/dist/index.html;
}

location = /admin/index.html {
    default_type text/html;
    alias /opt/mao/admin/dist/index.html;
}

location ^~ /admin/assets/ {
    alias /opt/mao/admin/dist/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location ^~ /admin/ {
    alias /opt/mao/admin/dist/;
    error_page 404 = @admin;
}

location @admin {
    root /opt/mao/admin/dist;
    rewrite ^ /index.html break;
}
