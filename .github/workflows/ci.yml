name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend TS Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json

      - name: Install dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Build backend-ts
        working-directory: backend-ts
        run: npm run build

      - name: Test backend-ts
        working-directory: backend-ts
        run: npm test

  admin:
    name: Admin Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

  desktop:
    name: Desktop Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run unit tests
        working-directory: desktop
        run: npm run test:unit

      - name: Build desktop
        working-directory: desktop
        run: npm run build

  agent-cli:
    name: Agent CLI Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json

      - name: Install dependencies
        working-directory: agent-cli
        run: npm ci

      - name: Build agent-cli
        working-directory: agent-cli
        run: npm run build

      - name: Test agent-cli
        working-directory: agent-cli
        run: npm test

      - name: Vendor localShell stays in sync
        run: cmp desktop/electron/localShell.cjs agent-cli/vendor/localShell.cjs

      - name: Pack agent-cli
        working-directory: agent-cli
        run: npm pack --dry-run
